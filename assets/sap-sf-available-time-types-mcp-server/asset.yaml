apiVersion: asset.sap/v1
kind: Asset
type: mcp-server

metadata:
  name: sap-sf-available-time-types-mcp-server
  description: Exposes SAP SuccessFactors Available Time Types API as MCP tools for listing time types applicable to an employee.
  translation: mcp-translation/translation.json
  apiSpec: mcp-translation/api-spec.json
  version: "1.0.0"

provides:
  apis:
    - name: sap-sf-available-time-types-mcp-server
      kind: mcp-server
      ordId: customer.build:apiResource:ec-time-account-diagnostics-25342.sap-sf-available-time-types-mcp-server:v1

requires:
  - name: AvailableTimeTypes
    kind: api
    ordId: sap.sf:apiResource:AvailableTimeTypes:v1
