apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: ec-time-account-diagnostics-agent
  description: AI agent that diagnoses SAP SuccessFactors Employee Central time account issues by tracing accrual postings, absences, and manual adjustments, then suggests and applies approved fixes with human approval.

type: agent

container:
  buildPath: .
  port: 5000

provides:
  apis:
    - name: ec-time-account-diagnostics-agent
      kind: a2a
      ordId: customer.build:apiResource:ec-time-account-diagnostics-25342.ec-time-account-diagnostics-agent:v1

requires:
  - name: sap-sf-balances-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:ec-time-account-diagnostics-25342.sap-sf-balances-mcp-server:v1
  - name: sap-sf-time-off-events-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:ec-time-account-diagnostics-25342.sap-sf-time-off-events-mcp-server:v1
  - name: sap-sf-available-time-types-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:ec-time-account-diagnostics-25342.sap-sf-available-time-types-mcp-server:v1
  - name: sap-sf-ec-time-off-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:ec-time-account-diagnostics-25342.sap-sf-ec-time-off-mcp-server:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
