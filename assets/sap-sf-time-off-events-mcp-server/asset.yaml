  description: Exposes SAP SuccessFactors Time Off Events API as MCP tools for retrieving accrual postings and time-off events.
  translation: mcp-translation/translation.json
  apiSpec: mcp-translation/api-spec.json
  version: "1.0.0"

provides:
  apis:
    - name: sap-sf-time-off-events-mcp-server
      kind: mcp-server
      ordId: customer.build:apiResource:ec-time-account-diagnostics-25342.sap-sf-time-off-events-mcp-server:v1

requires:
  - name: TimeOffEvents
    kind: api
    ordId: sap.sf:apiResource:TimeOffEvents:v1
