apiVersion: asset.sap/v1
kind: Asset
type: mcp-server

metadata:
  name: sap-sf-ec-time-off-mcp-server
  description: Exposes SAP SuccessFactors EC Time Off OData API as MCP tools for reading absence records, time account configuration, and applying approved corrections.
  translation: mcp-translation/translation.json
  apiSpec: mcp-translation/api-spec.edmx
  version: "1.0.0"

provides:
  apis:
    - name: sap-sf-ec-time-off-mcp-server
      kind: mcp-server
      ordId: customer.build:apiResource:ec-time-account-diagnostics-25342.sap-sf-ec-time-off-mcp-server:v1

requires:
  - name: ECTimeOff
    kind: api
    ordId: sap.sf:apiResource:ECTimeOff:v1
