apiVersion: asset.sap/v1
kind: Asset
type: mcp-server

metadata:
  name: sap-sf-balances-mcp-server
  description: Exposes SAP SuccessFactors Time Off Balances API as MCP tools for retrieving employee time account balances.
  translation: mcp-translation/translation.json
  apiSpec: mcp-translation/api-spec.json
  version: "1.0.0"

provides:
  apis:
    - name: sap-sf-balances-mcp-server
      kind: mcp-server
      ordId: customer.build:apiResource:ec-time-account-diagnostics-25342.sap-sf-balances-mcp-server:v1

requires:
  - name: Balances
    kind: api
    ordId: sap.sf:apiResource:Balances:v1
